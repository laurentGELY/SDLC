<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC Toolkit — Documentation</title>
<meta name="description" content="Harnais de gouvernance reproductible pour projets pilotés par Claude Code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/atelier-plateau-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', system-ui, sans-serif;
    background: oklch(0.985 0.005 85);
    color: oklch(0.24 0.015 260);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: oklch(0.48 0.13 264 / 0.18); }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 260); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-thumb:hover { background: oklch(0.72 0.015 260); background-clip: content-box; }

  .nav-group-label { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: oklch(0.58 0.02 260); padding: 0 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .nav-link { display: block; padding: 5px 8px; border-radius: 7px; font-size: 13.5px; line-height: 1.35; text-decoration: none; color: oklch(0.4 0.012 260); font-weight: 450; transition: background .13s, color .13s; margin-bottom: 1px; cursor: pointer; }
  .nav-link:hover:not([data-active]) { background: oklch(0.95 0.006 260); color: oklch(0.24 0.02 262); }
  .nav-link[data-active] { background: oklch(0.94 0.03 264); color: oklch(0.34 0.11 264); font-weight: 600; }

  /* ---------- Rendered markdown ---------- */
  .md { font-size: 16.5px; line-height: 1.72; color: oklch(0.3 0.012 260); max-width: 44rem; }
  .md > *:first-child { margin-top: 0; }
  .md h1 { font-size: 2.55rem; line-height: 1.08; letter-spacing: -0.025em; font-weight: 600; margin: 0 0 0.55em; color: oklch(0.22 0.02 262); }
  .md h2 { font-size: 1.42rem; line-height: 1.2; letter-spacing: -0.015em; font-weight: 600; margin: 2.6em 0 0.7em; padding-top: 1.4em; border-top: 1px solid oklch(0.9 0.008 260); color: oklch(0.24 0.02 262); scroll-margin-top: 24px; }
  .md h3 { font-size: 1.08rem; font-weight: 600; margin: 2em 0 0.5em; color: oklch(0.28 0.02 262); scroll-margin-top: 24px; }
  .md p { margin: 0 0 1.15em; text-wrap: pretty; }
  .md.is-home > h1 { font-size: 3.1rem; }
  .md.is-home > p:first-of-type, .md > h1 + p {
    font-family: 'Newsreader', Georgia, serif; font-size: 1.32rem; line-height: 1.5; color: oklch(0.4 0.015 260); margin-bottom: 1.4em;
  }
  .md a { color: oklch(0.47 0.14 264); text-decoration: none; border-bottom: 1px solid oklch(0.47 0.14 264 / 0.28); transition: border-color .15s, color .15s; }
  .md a:hover { border-bottom-color: oklch(0.47 0.14 264); }
  .md strong { font-weight: 600; color: oklch(0.22 0.02 262); }
  .md ul, .md ol { margin: 0 0 1.15em; padding-left: 1.35em; }
  .md li { margin: 0.35em 0; padding-left: 0.2em; }
  .md li::marker { color: oklch(0.6 0.03 264); }
  .md blockquote { margin: 1.6em 0; padding: 0.2em 0 0.2em 1.35em; border-left: 3px solid oklch(0.48 0.13 264); color: oklch(0.4 0.015 260); font-family: 'Newsreader', Georgia, serif; font-size: 1.12rem; line-height: 1.55; }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md blockquote strong { color: oklch(0.34 0.06 264); }
  .md code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.83em; background: oklch(0.95 0.008 260); color: oklch(0.35 0.05 300); padding: 0.14em 0.42em; border-radius: 5px; border: 1px solid oklch(0.91 0.008 260); white-space: nowrap; }
  .md pre { margin: 1.5em 0; padding: 1.15em 1.3em; background: oklch(0.975 0.006 85); border: 1px solid oklch(0.9 0.008 260); border-radius: 12px; overflow-x: auto; line-height: 1.6; box-shadow: 0 1px 2px oklch(0.5 0.02 260 / 0.04); }
  .md pre code { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; background: none; border: none; padding: 0; color: oklch(0.32 0.015 260); white-space: pre; }
  .md table { width: 100%; border-collapse: collapse; margin: 1.6em 0; font-size: 14.5px; line-height: 1.5; }
  .md thead th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.5 0.02 260); padding: 0 0.9em 0.7em; border-bottom: 1.5px solid oklch(0.86 0.01 260); }
  .md tbody td { padding: 0.7em 0.9em; border-bottom: 1px solid oklch(0.92 0.006 260); vertical-align: top; color: oklch(0.34 0.012 260); }
  .md tbody tr:hover { background: oklch(0.97 0.006 260); }
  .md tbody td:first-child, .md thead th:first-child { padding-left: 0.2em; }
  .md hr { border: none; border-top: 1px solid oklch(0.9 0.008 260); margin: 2.4em 0; }

  @keyframes fadeUp { from { transform: translateY(7px); } to { transform: none; } }
  .fade { animation: fadeUp .32s cubic-bezier(.2,.7,.2,1) both; }

  #menu-btn { display: none; }
  @media (max-width: 1100px) { .toc-col { display: none !important; } }
  @media (max-width: 820px) {
    .side-col { position: fixed; z-index: 30; left: 0; top: 0; transform: translateX(-100%); transition: transform .22s ease; box-shadow: 0 0 40px oklch(0.3 0.02 260 / 0.18); }
    .side-col.open { transform: none; }
    #menu-btn { display: flex; position: fixed; z-index: 40; top: 14px; left: 14px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid oklch(0.9 0.008 260); background: oklch(0.99 0.004 85); align-items: center; justify-content: center; cursor: pointer; }
    .content-col { padding: 68px 20px 80px !important; }
    .md h1 { font-size: 2rem !important; }
    .md.is-home > h1 { font-size: 2.2rem !important; }
  }
</style>
</head>
<body>
<button id="menu-btn" aria-label="Menu">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.3 0.02 260)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<div style="display:grid; grid-template-columns: 288px minmax(0,1fr); height:100vh; width:100%; overflow:hidden;">

  <aside id="sidebar" class="side-col scroll" style="grid-column:1; height:100vh; overflow-y:auto; border-right:1px solid oklch(0.91 0.008 260); background:oklch(0.995 0.004 85); padding:26px 18px 40px;">
    <a href="#" data-brand style="display:flex; gap:11px; align-items:center; text-decoration:none; padding:6px 8px; margin-bottom:26px;">
      <div style="width:34px; height:34px; border-radius:9px; background:oklch(0.24 0.02 262); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <div style="width:14px; height:14px; border:2px solid oklch(0.985 0.005 85); border-radius:4px; position:relative;">
          <div style="position:absolute; inset:2px 2px auto auto; width:5px; height:5px; background:oklch(0.62 0.16 264); border-radius:1px;"></div>
        </div>
      </div>
      <div>
        <div data-brand-title style="font-size:14.5px; font-weight:600; color:oklch(0.22 0.02 262); letter-spacing:-0.01em;">SDLC Toolkit</div>
        <div data-brand-sub style="font-family:'Geist Mono',monospace; font-size:10.5px; color:oklch(0.55 0.02 260); margin-top:1px;"></div>
      </div>
    </a>
    <div data-badge style="font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.05em; color:oklch(0.6 0.02 260); background:oklch(0.95 0.02 264); border:1px solid oklch(0.88 0.03 264); border-radius:6px; padding:5px 9px; margin:0 8px 24px; display:inline-block;">…</div>
    <nav data-nav style="display:flex; flex-direction:column; gap:22px;"></nav>
    <a data-repo href="#" target="_blank" rel="noopener" style="display:flex; gap:8px; align-items:center; margin:30px 8px 0; padding-top:20px; border-top:1px solid oklch(0.91 0.008 260); text-decoration:none; color:oklch(0.5 0.02 260); font-size:12.5px; font-weight:500;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span data-repo-label>laurentGELY/SDLC</span>
    </a>
  </aside>

  <div style="grid-column:2; display:grid; grid-template-columns: minmax(0,1fr) 216px; height:100vh; overflow:hidden;">
    <main data-scroll class="content-col scroll" style="grid-column:1; height:100vh; overflow-y:auto; padding:64px 72px 120px;">
      <div data-eyebrow style="font-family:'Geist Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:oklch(0.55 0.03 264); margin-bottom:20px; display:flex; align-items:center; gap:10px;"></div>
      <article data-content class="md">Chargement…</article>
      <div data-nextprev style="display:flex; justify-content:space-between; gap:16px; margin:64px 0 0; padding-top:28px; border-top:1px solid oklch(0.9 0.008 260);"></div>
    </main>
    <aside data-toc-col class="toc-col scroll" style="grid-column:2; height:100vh; overflow-y:auto; padding:66px 24px 80px 8px; border-left:1px solid oklch(0.93 0.006 260);">
      <div style="font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:oklch(0.58 0.02 260); margin-bottom:12px;">Sur cette page</div>
      <nav data-toc style="display:flex; flex-direction:column; gap:2px;"></nav>
    </aside>
  </div>
</div>

<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const state = { nav: null, meta: null, index: {}, order: [] };

  function waitFor(cond, cb, tries) {
    tries = tries || 0;
    if (cond()) return cb();
    if (tries > 80) return cb();
    setTimeout(() => waitFor(cond, cb, tries + 1), 60);
  }

  async function boot() {
    try {
      const [nav, meta] = await Promise.all([
        fetch('nav.json', { cache: 'no-cache' }).then(r => r.json()),
        fetch('meta.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({}))
      ]);
      state.nav = nav;
      state.meta = meta || {};
    } catch (e) {
      $('[data-content]').innerHTML = '<p style="color:oklch(0.5 0.14 25)">Impossible de charger <code>nav.json</code>. Servez le dossier via un serveur HTTP (voir README).</p>';
      return;
    }
    renderChrome();
    if (window.marked) window.marked.setOptions({ gfm: true, breaks: false });
    window.addEventListener('hashchange', route);
    waitFor(() => window.marked, route);
  }

  function renderChrome() {
    const n = state.nav;
    if (n.brand) {
      if (n.brand.title) $('[data-brand-title]').textContent = n.brand.title;
      if (n.brand.subtitle) $('[data-brand-sub]').textContent = n.brand.subtitle;
      if (n.brand.repo) {
        const r = $('[data-repo]'); r.href = n.brand.repo;
        $('[data-repo-label]').textContent = n.brand.repo.replace(/^https?:\/\/github\.com\//, '');
      }
    }
    $('[data-brand]').setAttribute('href', '#' + (n.home || 'intro'));
    const v = state.meta.version || '';
    $('[data-badge]').textContent = v ? v.replace('+', ' · ') : '';
    $('[data-badge]').style.display = v ? 'inline-block' : 'none';

    // build index + order + sidebar
    const navEl = $('[data-nav]');
    navEl.innerHTML = '';
    n.groups.forEach(g => {
      const wrap = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'nav-group-label';
      label.innerHTML = '<span>' + g.title + '</span><span style="opacity:.6;">' + g.num + '</span>';
      wrap.appendChild(label);
      g.items.forEach(it => {
        state.index[it.id] = { group: g.title, level: g.level, title: it.title };
        state.order.push(it.id);
        const a = document.createElement('a');
        a.className = 'nav-link';
        a.href = '#' + it.id;
        a.setAttribute('data-page', it.id);
        a.textContent = it.title;
        wrap.appendChild(a);
      });
      navEl.appendChild(wrap);
    });

    // mobile menu
    const btn = $('#menu-btn'), side = $('#sidebar');
    if (btn) btn.addEventListener('click', () => side.classList.toggle('open'));
    navEl.addEventListener('click', e => { if (e.target.closest('.nav-link')) side.classList.remove('open'); });
  }

  function setActive(id) {
    document.querySelectorAll('.nav-link').forEach(a => {
      if (a.getAttribute('data-page') === id) a.setAttribute('data-active', '1');
      else a.removeAttribute('data-active');
    });
  }

  function route() {
    const home = (state.nav && state.nav.home) || 'intro';
    let id = (location.hash || '').replace('#', '') || home;
    if (!state.index[id]) id = home;
    setActive(id);
    loadPage(id, home);
  }

  async function loadPage(id, home) {
    const contentEl = $('[data-content]');
    const eyebrowEl = $('[data-eyebrow]');
    const tocEl = $('[data-toc]');
    const scrollEl = $('[data-scroll]');
    const npEl = $('[data-nextprev]');
    if (state._current === id && contentEl.dataset.loaded) return;
    state._current = id;

    const info = state.index[id];
    eyebrowEl.innerHTML = '<span style="color:oklch(0.42 0.11 264); font-weight:600;">' + info.group + '</span>'
      + '<span style="width:4px;height:4px;border-radius:50%;background:oklch(0.75 0.02 260);display:inline-block;"></span>'
      + '<span>Niveau ' + info.level + '</span>';

    let md;
    try {
      const res = await fetch('pages/' + id + '.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      md = await res.text();
      if (md.startsWith('<!DOCTYPE') || md.startsWith('<html')) throw new Error('not md');
    } catch (e) {
      contentEl.innerHTML = '<p style="color:oklch(0.5 0.14 25)">Impossible de charger <code>pages/' + id + '.md</code>.</p>';
      return;
    }

    contentEl.innerHTML = window.marked ? window.marked.parse(md) : md;
    contentEl.classList.toggle('is-home', id === home);
    contentEl.classList.remove('fade'); void contentEl.offsetWidth; contentEl.classList.add('fade');
    contentEl.dataset.loaded = '1';

    const heads = contentEl.querySelectorAll('h2');
    tocEl.innerHTML = '';
    const tocCol = $('[data-toc-col]');
    if (!heads.length) { tocCol.style.visibility = 'hidden'; }
    else {
      tocCol.style.visibility = 'visible';
      heads.forEach((h, i) => {
        h.id = 'h-' + i;
        const link = document.createElement('a');
        link.href = '#' + id;
        link.textContent = h.textContent;
        Object.assign(link.style, { fontSize: '12.5px', lineHeight: '1.35', color: 'oklch(0.5 0.015 260)', textDecoration: 'none', padding: '4px 0 4px 11px', borderLeft: '2px solid oklch(0.9 0.008 260)', transition: 'color .13s, border-color .13s' });
        link.addEventListener('mouseenter', () => { link.style.color = 'oklch(0.34 0.11 264)'; link.style.borderLeftColor = 'oklch(0.55 0.12 264)'; });
        link.addEventListener('mouseleave', () => { link.style.color = 'oklch(0.5 0.015 260)'; link.style.borderLeftColor = 'oklch(0.9 0.008 260)'; });
        link.addEventListener('click', ev => { ev.preventDefault(); scrollEl.scrollTo({ top: h.offsetTop - 40, behavior: 'smooth' }); });
        tocEl.appendChild(link);
      });
    }

    const idx = state.order.indexOf(id);
    const mk = (pid, dir) => {
      const t = state.index[pid].title;
      const a = document.createElement('a');
      a.href = '#' + pid;
      Object.assign(a.style, { display: 'flex', flexDirection: 'column', gap: '4px', textDecoration: 'none', padding: '14px 18px', border: '1px solid oklch(0.9 0.008 260)', borderRadius: '11px', maxWidth: '48%', transition: 'border-color .14s, background .14s', alignItems: dir === 'next' ? 'flex-end' : 'flex-start', textAlign: dir === 'next' ? 'right' : 'left' });
      a.addEventListener('mouseenter', () => { a.style.borderColor = 'oklch(0.6 0.12 264)'; a.style.background = 'oklch(0.98 0.01 264)'; });
      a.addEventListener('mouseleave', () => { a.style.borderColor = 'oklch(0.9 0.008 260)'; a.style.background = 'transparent'; });
      a.innerHTML = '<span style="font-family:\'Geist Mono\',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:oklch(0.55 0.03 264);">' + (dir === 'next' ? 'Suivant →' : '← Précédent') + '</span><span style="font-size:14px; font-weight:600; color:oklch(0.26 0.02 262);">' + t + '</span>';
      return a;
    };
    npEl.innerHTML = '';
    npEl.appendChild(idx > 0 ? mk(state.order[idx - 1], 'prev') : document.createElement('span'));
    npEl.appendChild(idx < state.order.length - 1 ? mk(state.order[idx + 1], 'next') : document.createElement('span'));

    if (window.hljs) contentEl.querySelectorAll('pre code').forEach(b => { try { window.hljs.highlightElement(b); } catch (e) {} });
    if (scrollEl) scrollEl.scrollTop = 0;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
